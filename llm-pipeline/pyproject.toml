[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-pipeline"
version = "0.1.0"
description = "GenAI pipeline that extracts cited KPIs from SEC 10-Q/10-K filings and validates them against XBRL."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Spruha Nimkar" }]
dependencies = [
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
kpi = "kpi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
